<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Now Playing – Cassette</title>
  <!--
    Retro cassette tape: hand-written label, spinning reels, the tape moves from
    the left reel to the right one as the track plays. A new track ejects the
    tape and inserts a new one.
    OBS: Browser Source, URL http://localhost/cassette.html, 1920x1080, transparent.
    URL parameters: see nowplaying.js (?hide=, ?ws=, ?demo).
  -->
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    /* the tape slides up from below the screen */
    #deck {
      position: absolute;
      left: 60px;
      bottom: 60px;
      transition: transform .8s cubic-bezier(.3, 1.3, .5, 1);
    }

    #deck.out {
      transform: translateY(130%) rotate(-6deg);
      transition-timing-function: ease-in;
    }

    .shell {
      position: relative;
      width: 560px;
      height: 340px;
      border-radius: 18px;
      background: linear-gradient(160deg, #3a3a42, #1b1b20 60%, #26262c);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 20px 40px rgba(0, 0, 0, .5);
    }

    .screw {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #aaa, #444);
    }

    .screw::after {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 6px;
      height: 2px;
      background: #222;
      transform: rotate(35deg);
    }

    .s1 { left: 10px; top: 10px; }
    .s2 { right: 10px; top: 10px; }
    .s3 { left: 10px; bottom: 10px; }
    .s4 { right: 10px; bottom: 10px; }

    /* paper label with ruled lines and a colored stripe */
    .label {
      position: absolute;
      left: 30px;
      right: 30px;
      top: 26px;
      height: 196px;
      overflow: hidden;
      border-radius: 8px;
      background:
        repeating-linear-gradient(transparent 0 29px, rgba(70, 110, 200, .22) 29px 30px),
        #f4ecd6;
    }

    .stripe {
      height: 16px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .side {
      position: absolute;
      left: 14px;
      top: 22px;
      font: 700 28px/1 Georgia, serif;
      color: var(--accent);
    }

    .handwriting {
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      color: #1d2a6b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #title {
      margin: 10px 18px 0 52px;
      font-size: 32px;
      font-weight: 700;
    }

    #artist {
      margin: 0 18px 0 52px;
      font-size: 22px;
      opacity: .8;
    }

    /* tape window with the two reels */
    .window {
      position: absolute;
      left: 50%;
      bottom: 118px;
      width: 320px;
      height: 96px;
      transform: translateX(-50%) translateY(50%);
      border-radius: 48px;
      background: rgba(18, 18, 22, .92);
      box-shadow: inset 0 0 0 3px #111, inset 0 6px 14px rgba(0, 0, 0, .7);
    }

    .reel {
      position: absolute;
      top: 6px;
      width: 84px;
      height: 84px;
    }

    .reel.left { left: 18px; }
    .reel.right { right: 18px; }

    /* wound tape: its radius is driven by --r from the elapsed time */
    .pack {
      position: absolute;
      inset: calc(50% - var(--r, 30px));
      border-radius: 50%;
      background: radial-gradient(circle, #5a3d2a, #2a1b12);
      transition: inset 1s linear;
    }

    .hub {
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #222 0 22%, transparent 23%),
        repeating-conic-gradient(#ececec 0 40deg, #8a8a8a 40deg 60deg);
      animation: spin 2.2s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(-360deg);
      }
    }

    /* idle (warm-up): reels turn slowly */
    #deck.idle .hub {
      animation-duration: 8s;
    }

    .bottom {
      position: absolute;
      left: 120px;
      right: 120px;
      bottom: 0;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
      background: #15151a;
      font: 600 15px/1 Consolas, monospace;
      letter-spacing: 1px;
      color: #9a9aa8;
    }
  </style>
</head>

<body>
  <div id="deck" class="out">
    <div class="shell">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <div class="label">
        <div class="stripe"></div>
        <div class="side">A</div>
        <div class="handwriting" id="title"></div>
        <div class="handwriting" id="artist"></div>
      </div>
      <div class="window">
        <div class="reel left"><div class="pack" id="packL"></div><div class="hub"></div></div>
        <div class="reel right"><div class="pack" id="packR"></div><div class="hub"></div></div>
      </div>
      <div class="bottom"><span id="time">0:00</span><span id="meta"></span></div>
    </div>
  </div>

  <script src="nowplaying.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const EJECT_MS = 800;           // matches the #deck transition
    const TAPE_LENGTH_S = 360;      // track length is unknown: the tape "runs" for 6 minutes
    const PACK_MIN = 24;            // wound tape radius range, px
    const PACK_MAX = 41;

    function hue(text) {
      let h = 0;
      for (const ch of text) h = (h * 31 + ch.codePointAt(0)) % 360;
      return h;
    }

    /** Moves the tape from the left reel to the right one. */
    function updateReels(seconds) {
      const done = Math.min(1, seconds / TAPE_LENGTH_S);
      $('packL').style.setProperty('--r', `${PACK_MAX - (PACK_MAX - PACK_MIN) * done}px`);
      $('packR').style.setProperty('--r', `${PACK_MIN + (PACK_MAX - PACK_MIN) * done}px`);
    }

    function show(track, previous) {
      const deck = $('deck');
      deck.classList.add('out');
      setTimeout(() => {
        const h = hue((track.artist || '') + (track.title || ''));
        deck.style.setProperty('--accent', `hsl(${h} 75% 48%)`);
        deck.style.setProperty('--accent2', `hsl(${(h + 40) % 360} 85% 58%)`);
        deck.classList.toggle('idle', !!track.idle);
        $('title').textContent = track.title || '—';
        $('artist').textContent = track.artist || '';
        const bpm = track.tags && track.tags.bpm ? `${track.tags.bpm} BPM` : '';
        $('meta').textContent = track.idle ? 'STANDBY' : (bpm || 'SIDE A');
        updateReels(0);
        deck.classList.remove('out');
        NowPlaying.fitText($('title'), 20);
        NowPlaying.autoHide(() => deck.classList.add('out'));
      }, previous ? EJECT_MS : 50);
    }

    setInterval(() => {
      const s = NowPlaying.elapsed();
      $('time').textContent = NowPlaying.formatTime(s);
      updateReels(s);
    }, 1000);

    NowPlaying.start({ onTrack: show });
  </script>
</body>

</html>
