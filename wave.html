<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Now Playing – Wave</title>
  <!--
    Frosted glass lower third with an animated (procedural) equalizer; shows the
    previous track by sending a "history" request over the WebSocket.
    OBS: Browser Source, URL http://localhost/wave.html, 1920x1080, transparent.
    URL parameters: see nowplaying.js (?hide=, ?ws=).
  -->
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #fff;
    }

    /* the bar rises from below the screen */
    #bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 50px;
      display: flex;
      height: 130px;
      transform: translateY(200px);
      transition: transform .8s cubic-bezier(.2, 1, .3, 1);
    }

    #bar.on {
      transform: none;
    }

    .glass {
      position: relative;
      flex: 1;
      margin: 0 60px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 24px;
      background: linear-gradient(100deg, rgba(20, 24, 40, .72), rgba(30, 20, 50, .55));
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }

    #eq {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .55;
    }

    .content {
      position: relative;
      display: flex;
      align-items: center;
      gap: 34px;
      height: 100%;
      padding: 0 40px;
    }

    .badge {
      flex: none;
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      font-size: 38px;
      background: radial-gradient(circle at 30% 30%, #7af, #a3f 60%, #f3a);
      box-shadow: 0 0 30px rgba(170, 80, 255, .6);
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      50% {
        transform: scale(1.08) rotate(-6deg);
      }
    }

    /* title + artist: the old slot moves up and out, the new one comes from below */
    .text {
      flex: 1;
      min-width: 0;
    }

    .swap {
      position: relative;
      height: 96px;
    }

    .slot {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform .7s cubic-bezier(.3, 1.3, .5, 1), opacity .5s;
    }

    .slot.enter {
      opacity: 0;
      transform: translateY(60px);
    }

    .slot.leave {
      opacity: 0;
      transform: translateY(-60px);
    }

    .title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 44px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #cfe 40%, #fff 60%, #fcf);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: -200% 0;
      }
    }

    .artist {
      margin-top: 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 24px;
      color: #cbd5ff;
    }

    /* right side: time, live badge, genre/bpm, previous track */
    .side {
      flex: none;
      max-width: 420px;
      text-align: right;
      font-size: 15px;
      line-height: 1.6;
      color: #aab;
    }

    #genre {
      font-weight: 600;
      color: #fff;
    }

    #time {
      font-size: 30px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .live {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      background: #f24;
    }

    .live.off {
      background: #555;
    }
  </style>
</head>

<body>
  <div id="bar">
    <div class="glass">
      <canvas id="eq"></canvas>
      <div class="content">
        <div class="badge">♫</div>
        <div class="text">
          <div class="swap" id="swap"></div>
        </div>
        <div class="side">
          <div><span id="time">0:00</span><span class="live off" id="live">LIVE</span></div>
          <div id="genre"></div>
          <div id="prev"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="nowplaying.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const SLOT_MS = 700;    // slot transition time (matches the CSS)
    const EQ_BARS = 64;
    let hideTimer = null;
    let energy = 0;         // equalizer amplitude: jumps to 1 on a track change, then calms down

    /** Replaces the title/artist slot with an animated one. */
    function swapText(track) {
      const swap = $('swap');
      for (const old of swap.children) {
        old.classList.add('leave');
        setTimeout(() => old.remove(), SLOT_MS);
      }
      const slot = document.createElement('div');
      slot.className = 'slot enter';
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = track.title || '—';
      const artist = document.createElement('div');
      artist.className = 'artist';
      artist.textContent = track.artist || '';
      slot.append(title, artist);
      swap.appendChild(slot);
      // two frames: let the browser render the start state before transitioning
      requestAnimationFrame(() => requestAnimationFrame(() => slot.classList.remove('enter')));
    }

    function show(track) {
      swapText(track);
      const bpm = track.tags && track.tags.bpm ? `${track.tags.bpm} BPM` : '';
      $('genre').textContent = [track.genre, bpm].filter(Boolean).join(' · ');
      $('bar').classList.add('on');
      energy = 1;

      clearTimeout(hideTimer);
      if (NowPlaying.hideAfter > 0) {
        hideTimer = setTimeout(() => $('bar').classList.remove('on'), NowPlaying.hideAfter * 1000);
      }
      // ask the server for the previous track; the answer arrives in onMessage
      NowPlaying.send({ cmd: 'history', limit: 1, id: 'prev' });
    }

    function showPrevious(msg) {
      if (msg.type !== 'history' || msg.id !== 'prev') return;
      const p = msg.items[0];
      $('prev').textContent = p ? `previous: ${p.artist ? `${p.artist} – ` : ''}${p.title}` : '';
    }

    // procedural equalizer: a sum of sine waves, not real audio levels
    const canvas = $('eq');
    const ctx = canvas.getContext('2d');

    function draw(timestamp) {
      const w = (canvas.width = canvas.clientWidth);
      const h = (canvas.height = canvas.clientHeight);
      const barWidth = w / EQ_BARS;
      const t = timestamp / 1000;
      energy = Math.max(0.35, energy * 0.995);

      for (let i = 0; i < EQ_BARS; i++) {
        const wave = Math.sin(i * 0.35 + t * 3.1) * 0.5 +
          Math.sin(i * 0.13 - t * 1.7) * 0.3 +
          Math.sin(i * 0.9 + t * 5) * 0.2;
        const barHeight = ((wave + 1) / 2) * h * 0.8 * energy;
        const hueValue = 200 + i * 2.5;
        const gradient = ctx.createLinearGradient(0, h, 0, h - barHeight);
        gradient.addColorStop(0, `hsla(${hueValue}, 90%, 60%, 0)`);
        gradient.addColorStop(1, `hsla(${hueValue}, 90%, 65%, .9)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(i * barWidth + 2, h - barHeight, barWidth - 4, barHeight);
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    setInterval(() => {
      if (NowPlaying.track) $('time').textContent = NowPlaying.formatTime(NowPlaying.elapsed());
    }, 500);

    NowPlaying.start({
      onTrack: show,
      onSource: (live) => $('live').classList.toggle('off', !live),
      onMessage: showPrevious,
    });
  </script>
</body>

</html>
